<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" role="img" aria-labelledby="title desc">
  <title id="title">Ordo Missæ</title>
  <desc id="desc">A medieval cross above a Chinese seal-inspired sacred book mark</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d08a"/>
      <stop offset=".45" stop-color="#b38745"/>
      <stop offset="1" stop-color="#795324"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9573e"/>
      <stop offset="1" stop-color="#7e241d"/>
    </linearGradient>
    <filter id="soft-glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- The transparent field lets the mark sit naturally on light or dark chrome. -->
  <g transform="translate(96 96)">
    <path d="M0-88 11-68 31-63 25-43 43-31 31-12 43 0 31 12 43 31 25 43 31 63 11 68 0 88-11 68-31 63-25 43-43 31-31 12-43 0-31-12-43-31-25-43-31-63-11-68Z"
      fill="none" stroke="url(#gold)" stroke-width="4" stroke-linejoin="round" opacity=".92">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="42s" repeatCount="indefinite"/>
    </path>
    <path d="M-9-67h18v27h27v18H9v27H-9v-27h-27v-18H-9Z" fill="url(#gold)" filter="url(#soft-glow)">
      <animate attributeName="opacity" values=".9;1;.9" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M-55-34Q-55-55-34-55h68q21 0 21 21v68q0 21-21 21h-68q-21 0-21-21Z"
      fill="url(#red)" stroke="url(#gold)" stroke-width="4"/>
    <path d="M-44-31v-10h88v10M-44 31v10h88V31" fill="none" stroke="#f6dfaa" stroke-width="3" opacity=".8"/>
    <text x="0" y="23" text-anchor="middle" fill="#fff1c9"
      font-family="Songti TC, Noto Serif CJK TC, serif" font-size="67" font-weight="700">經</text>
    <path d="M-60-6h10M50-6h10" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
